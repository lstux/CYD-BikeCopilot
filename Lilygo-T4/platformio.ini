; BikeCopilot - LilyGO TTGO T4 V1.3 (ESP32 d'origine, écran ILI9341 320x240, 4 boutons)
; Position fournie par le téléphone (appli Android SensorServer, Wi-Fi). Brochage : voir Hardware.md.

[platformio]
default_envs = dashboard

[env]
; Version figée (Arduino-ESP32 2.0.x) : TFT_eSPI n'est pas fiable avec le core 3.x (comme pour la CYD)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Flash de 4 Mo : partition « huge_app » (pas d'OTA) car Wi-Fi + serveur web + polices + pages sont gros
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

; Code partagé avec les autres variantes (../common/src) + configuration TFT_eSPI pour la T4 V1.3.
; La PSRAM (8 Mo) n'est volontairement pas activée pour l'instant : rien n'en a besoin, et les
; sprites restent ainsi dans la RAM interne (plus rapide). Elle servira au cache de tuiles de la carte.
build_flags =
    -I$PROJECT_DIR/../common/src
    -I$PROJECT_DIR/src/dashboard
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=27
    -DTFT_DC=32
    -DTFT_RST=5
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Tableau de bord (jauge + liaison téléphone)
[env:dashboard]
build_src_filter = -<*> +<dashboard/>

; Tableau de bord pour tester à pied : la jauge démarre à 5 km/h (paliers de 5)
[env:dashboard-walk]
build_src_filter = -<*> +<dashboard/>
build_flags =
    ${env.build_flags}
    -DGAUGE_MIN_MAX=5
    -DSPEED_START_KMH=2.0
    -DSPEED_STOP_KMH=1.2
