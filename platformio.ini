; Compteur vélo - ESP32-2432S028 (CYD) + GPS + QMC5883
; Câblage prévu :
;   GPS TX      -> IO35 (entrée seule)
;   QMC5883 SDA -> IO27, SCL -> IO22
;   3V3 / GND communs

[platformio]
default_envs = nmea

[env]
; Version figée (Arduino-ESP32 2.0.x) : TFT_eSPI n'est pas fiable avec le core 3.x
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mikalhart/TinyGPSPlus@^1.1.0

; Configuration TFT_eSPI pour la CYD (utilisée à partir de l'étape dashboard)
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

; Tableau de bord complet
[env:dashboard]
build_src_filter = -<*> +<dashboard/>

; Tableau de bord pour tester à pied : la jauge démarre à 5 km/h (paliers de 5)
[env:dashboard-walk]
build_src_filter = -<*> +<dashboard/>
build_flags =
    ${env.build_flags}
    -DGAUGE_MIN_MAX=5
    -DSPEED_START_KMH=2.0
    -DSPEED_STOP_KMH=1.2

; Test 1 : scan I2C (cherche le QMC5883)
[env:i2cscan]
build_src_filter = -<*> +<i2cscan/>

; Test 2 : trames NMEA brutes du GPS sur IO35
[env:nmea]
build_src_filter = -<*> +<nmea/>
